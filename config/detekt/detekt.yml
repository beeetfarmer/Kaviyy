# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    constructorThreshold: 11 # design-token enums carry one value per dimension
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true # enum → string-resource tables
  TooManyFunctions:
    ignoreAnnotated: ['Dao', 'Database', 'HiltViewModel', 'Module'] # one function per query (DAO) / user intent (VM) / binding (DI)
style:
  ThrowsCount:
    excludes: ['**/test/**']
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'Composable']
    ignoreEnums: true # enum entries map 1:1 to Kavita API values
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    comments:
      - value: 'FIXME:'
      - value: 'STOPSHIP:'
  MaxLineLength:
    maxLineLength: 120
