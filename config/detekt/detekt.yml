# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    constructorThreshold: 11 # design-token enums carry one value per dimension
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotated: ['Dao'] # one function per query is the point of a DAO
style:
  ThrowsCount:
    excludes: ['**/test/**']
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'Composable']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    comments:
      - value: 'FIXME:'
      - value: 'STOPSHIP:'
  MaxLineLength:
    maxLineLength: 120
